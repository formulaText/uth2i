<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="XのUnder the Hoodレポートを、X投稿用の図解2枚に変換するツール。データは端末の外に出ません。">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>UtH2i</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Outfit:wght@500;600;800&family=M+PLUS+Rounded+1c:wght@500;800;900&family=Fredoka:wght@600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: 余白多めの1カラム。ヘッダー → 読み込み → 2枚の図解。見た目は下のドロワーで切り替える */
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --ink:#141414; --muted:#6E6E6A; --faint:#A3A39E; --line:#E6E6E2;
  --bad:#B42318; --bad-soft:#FBEAE8;
  --font-logo:"Outfit","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#191919; --ink:#EDEDEA; --muted:#9A9A95; --faint:#62625E; --line:#2A2A28;
  --bad:#FF8A80; --bad-soft:#331A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#191919; --ink:#EDEDEA; --muted:#9A9A95; --faint:#62625E; --line:#2A2A28;
  --bad:#FF8A80; --bad-soft:#331A18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:6px 110px}
p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ヘッダー */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);
  box-shadow:0 0 0 100vmax var(--bg),0 1px 0 100vmax transparent;clip-path:inset(0 -100vmax -1px);transition:box-shadow .2s}
.top.scrolled{box-shadow:0 0 0 100vmax var(--bg),0 1px 0 100vmax var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;display:block}
.logo{font-family:var(--font-logo);font-weight:600;font-size:1.45rem;letter-spacing:-.02em;line-height:1}
.logo b{font-weight:600;color:var(--faint)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:none;border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:500;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.lead{color:var(--muted);font-size:.85rem;margin-top:-10px;white-space:pre-line}

/* 読み込み */
.loader{display:flex;flex-direction:column;gap:8px}
.get{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline}
.get-url{font-family:var(--font-mono);font-size:.75rem;color:var(--faint);user-select:all}
.get a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;gap:4px}
/* iOSは16px未満の入力欄を選ぶと自動で拡大するので、16pxにしておく */
.catcher{width:100%;height:84px;resize:none;overflow:hidden;font-family:var(--font-mono);font-size:16px;line-height:24px;
  background:var(--surface);color:var(--muted);border:1.5px dashed var(--muted);border-radius:12px;padding:16px;word-break:break-all;cursor:text}
.catcher::placeholder{color:var(--muted);font-family:var(--font-body);font-size:15px;line-height:26px;text-align:left}
.paste-label{font-size:.95rem;font-weight:600}
.or-file{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.or-file .tx-copy{margin-left:0}
.catcher.drag{border-style:solid;border-color:var(--ink);background:var(--bg)}
.catcher:focus{border-style:solid;border-color:var(--muted);outline:none}
.state{font-size:.82rem;color:var(--muted)}
.state.on{color:var(--ink);font-weight:600}
.err{color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:.86rem}

/* プレビュー */
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 0 10px;font-size:.85rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stale{opacity:.35}
.pages figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.pages img{width:100%;aspect-ratio:1240/1754;display:block;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.pages figcaption{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.mini{border:0;background:none;padding:2px 0;font-size:.78rem;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.mini:disabled,.btn:disabled,.zip:disabled{opacity:.35;cursor:not-allowed}
.xpost{border-radius:12px;padding:14px;display:flex;gap:12px;border:1px solid var(--line)}
.xpost .av{width:40px;height:40px;border-radius:50%;flex:none}
.xpost .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.xpost .nm{font-weight:700;font-size:.9rem}
.xgrid{aspect-ratio:16/9;display:grid;grid-template-columns:1fr 1fr;gap:2px;border-radius:16px;overflow:hidden}
.xgrid img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.note{font-size:.78rem;color:var(--muted)}

/* 投稿用テキスト */
.texts{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.tx-title{margin:0;font-size:.95rem;font-weight:600}
.tx{display:flex;flex-direction:column;gap:6px}
.tx-head{display:flex;align-items:baseline;gap:10px;font-size:.82rem}
.tx-head > span:first-child{font-weight:600}
.tx-count{color:var(--faint);font-size:.75rem;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tx-count.over{color:var(--bad)}
.tx-copy{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:600}
.tx-copy:disabled{opacity:.35;cursor:not-allowed}
.tx-copy.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tx textarea{width:100%;resize:vertical;font:inherit;font-size:.85rem;line-height:1.6;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* 保存データ */
.data{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.hist-wrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:calc(44px * 9.5);overflow-y:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.hist::-webkit-scrollbar{display:none}
.hist li{flex:none}
.hist li+li{border-top:1px solid var(--line)}
.hist button{width:100%;height:44px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:var(--surface);padding:0 14px 0 12px;text-align:left}
/* iOS風：スクロール中だけ細いハンドルが浮かぶ */
.hist-thumb{position:absolute;top:0;right:3px;width:3px;border-radius:2px;background:var(--muted);opacity:0;transition:opacity .35s;pointer-events:none}
.hist-thumb.on{opacity:.55;transition:opacity .1s}
.hist button[aria-current="true"]{background:var(--bg);font-weight:600}
.hist .h-main{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .h-sub{flex:none;color:var(--muted);font-size:.75rem;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.data-btns{display:flex;flex-wrap:wrap;gap:8px}
.data-btns .tx-copy{margin-left:0}
.tx-copy.danger{color:var(--bad)}
.tx-copy.danger-solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
/* 消去確認のモーダル（背面はぼかし・スクロール不可） */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overscroll-behavior:contain;touch-action:none}
.modal-card{width:100%;max-width:360px;background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-card h2{margin:0;font-size:1rem}
.modal-card p{font-size:.88rem;color:var(--muted)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns .tx-copy{margin-left:0;padding:8px 16px;font-size:.85rem}
@media (prefers-reduced-transparency:reduce){.modal{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.55)}}

/* 下部バーとドロワー */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.bar-in{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.bar-row{display:flex;gap:8px}
.btn{font-weight:600;border-radius:10px;padding:11px 14px;border:1px solid var(--line);background:var(--surface);flex:1;min-width:0}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.look{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.xpost-btn{flex:0 0 auto;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);white-space:nowrap}
.xpost-btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.chev{width:10px;height:10px;transition:transform .2s}
.btn.look[aria-expanded="true"] .chev{transform:rotate(180deg)}
.status{font-size:.76rem;color:var(--muted);min-height:1.3em}
.drawer{position:fixed;left:0;right:0;z-index:5;bottom:var(--bar-h,72px);background:var(--surface);border-top:1px solid var(--line);
  transform:translateY(calc(100% + var(--bar-h,72px)));transition:transform .22s ease;
  padding:16px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px))}
.drawer.open{transform:none}
.drawer-in{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:6.5em 1fr;gap:10px;align-items:baseline}
.row > span{font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px 16px}
.chip{border:0;background:none;padding:4px 0;font-size:.9rem;color:var(--muted);border-bottom:1.5px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.zip{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:.8rem;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
/* ライトボックス（どのテーマでも暗い幕で固定） */
.pages img,.xgrid img{cursor:zoom-in}
.pages img.blank,.xgrid img.blank{cursor:default;border-color:transparent;background:transparent}
.lb{position:fixed;inset:0;z-index:30;background:#0C0C0C;color:#FFFFFF;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb-view{flex:1;min-height:0;overflow:hidden;touch-action:none;position:relative}
.lb-track{display:flex;width:200%;height:100%;transition:transform .26s ease}
.lb-track.drag{transition:none}
.lb-slide{width:50%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 16px 8px}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.lb-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);z-index:1;
  width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#FFFFFF;display:grid;place-items:center}
.lb-foot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px 16px}
.lb-dots{display:flex;gap:4px}
.lb-dots button{width:28px;height:28px;border:0;background:none;display:grid;place-items:center;padding:0}
.lb-dots button::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.lb-dots button[aria-current="true"]::after{background:#FFFFFF}
.lb-hint{font-size:.75rem;color:rgba(255,255,255,.6)}
.lb :focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.drawer,.chev,.lb-track{transition:none}}
</style>

<div class="wrap">
  <header class="top" id="top">
    <div class="brand">
      <svg class="mark" width="26" height="22" viewBox="0 0 26 22" aria-hidden="true">
        <rect x="1" y="1" width="10.5" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <rect x="14.5" y="1" width="10.5" height="20" rx="2" fill="currentColor"/>
      </svg>
      <span class="logo">UtH<b>2</b>i</span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <p class="lead" data-i18n="lead"></p>

  <section class="loader">
    <p class="get"><span data-i18n="getLead"></span><a href="https://x.com/i/under_the_hood" target="_blank" rel="noopener"><span data-i18n="getLink"></span><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2 3 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a><span class="get-url">x.com/i/under_the_hood</span></p>
    <label class="paste-label" for="src" data-i18n="pasteLabel"></label>
    <textarea id="src" class="catcher" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-ph="catcher"></textarea>
    <div class="or-file">
      <span data-i18n="orFile"></span>
      <button type="button" class="tx-copy" id="fileBtn" data-i18n="fromFile"></button>
      <input type="file" id="srcFile" accept="application/json,.json,text/plain" hidden>
    </div>
    <p class="state" id="state"></p>
    <div id="err" class="err" hidden></div>
  </section>

  <section class="stage">
    <div class="tabs" role="group" data-i18n-aria="tabsAria">
      <button type="button" data-view="all" aria-pressed="true" data-i18n="tabAll"></button>
      <button type="button" data-view="x" aria-pressed="false" data-i18n="tabX"></button>
    </div>
    <div id="viewAll" class="pages">
      <figure><img id="img1" data-i18n-alt="alt1"><figcaption><span data-i18n="cap1"></span><button type="button" class="mini" data-save="0" data-i18n="saveOne"></button></figcaption></figure>
      <figure><img id="img2" data-i18n-alt="alt2"><figcaption><span data-i18n="cap2"></span><button type="button" class="mini" data-save="1" data-i18n="saveOne"></button></figcaption></figure>
    </div>
    <div id="viewX" hidden>
      <div class="xpost" id="xpost">
        <div class="av" id="xav"></div>
        <div class="body"><span class="nm" data-i18n="yourPost"></span>
          <div class="xgrid"><img id="ximg1" data-i18n-alt="alt1"><img id="ximg2" data-i18n-alt="alt2"></div>
        </div>
      </div>
    </div>
    <p class="note" data-i18n="note"></p>
  </section>

  <section class="texts" aria-labelledby="txTitle">
    <h2 class="tx-title" id="txTitle" data-i18n="txTitle"></h2>
    <p class="note" data-i18n="txNote"></p>
    <div class="tx" data-tx="post"><div class="tx-head"><span data-i18n="txPost"></span><span class="tx-count" id="cnt-post"></span><button type="button" class="tx-copy" data-copy="post" data-i18n="copy"></button></div><textarea id="tx-post" rows="4" readonly></textarea></div>
    <div class="tx" data-tx="alt1"><div class="tx-head"><span data-i18n="txAlt1"></span><span class="tx-count" id="cnt-alt1"></span><button type="button" class="tx-copy" data-copy="alt1" data-i18n="copy"></button></div><textarea id="tx-alt1" rows="4" readonly></textarea></div>
    <div class="tx" data-tx="alt2"><div class="tx-head"><span data-i18n="txAlt2"></span><span class="tx-count" id="cnt-alt2"></span><button type="button" class="tx-copy" data-copy="alt2" data-i18n="copy"></button></div><textarea id="tx-alt2" rows="4" readonly></textarea></div>
  </section>

<section class="data" aria-labelledby="dataTitle">
    <h2 class="tx-title" id="dataTitle" data-i18n="dataTitle"></h2>
    <p class="note" data-i18n="dataNote"></p>
    <div class="data-btns">
      <button type="button" class="tx-copy" id="exportBtn" data-i18n="export"></button>
      <button type="button" class="tx-copy" id="importBtn" data-i18n="import"></button>
      <button type="button" class="tx-copy danger" id="clearBtn" data-i18n="clearAll"></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="status" id="dataStatus" role="status"></p>
    <div class="hist-wrap" id="histWrap">
      <ul class="hist" id="hist"></ul>
      <span class="hist-thumb" id="histThumb" aria-hidden="true"></span>
    </div>
    <p class="note" id="histEmpty" data-i18n="histEmpty"></p>
  </section>

</div>

<div class="drawer" id="drawer" inert>
  <div class="drawer-in">
    <div class="row"><span data-i18n="optStyle"></span><div class="chips" id="styles"></div></div>
    <div class="row"><span data-i18n="optMode"></span><div class="chips" id="modes"></div></div>
    <div class="row"><span data-i18n="optSort"></span><div class="chips" id="sorts"></div></div>
    <button type="button" class="zip" id="saveZip" data-i18n="zip"></button>
  </div>
</div>
<div class="bar" id="bar">
  <div class="bar-in">
    <div class="bar-row">
      <button id="look" class="btn look" type="button" aria-expanded="false" aria-controls="drawer"><span data-i18n="look"></span>
        <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 7 L5 3 L9 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="saveBoth" class="btn primary" type="button"></button>
      <a id="postX" class="btn xpost-btn" href="https://x.com/intent/post" target="_blank" rel="noopener" data-i18n="postX"></a>
    </div>
    <p class="status" id="status"></p>
  </div>
</div>

<div class="modal" id="confirmBox" hidden>
  <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle" aria-describedby="cfText">
    <h2 id="cfTitle" data-i18n="clearTitle"></h2>
    <p id="cfText" data-i18n="clearConfirm"></p>
    <div class="modal-btns">
      <button type="button" class="tx-copy" id="clearNo" data-i18n="clearNo"></button>
      <button type="button" class="tx-copy danger-solid" id="clearYes" data-i18n="clearYes"></button>
    </div>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" hidden>

  hidden:/not shown|removed|hidden from (all|everyone)/i, followersTL:/home timeline/i, search:/search/i
};
const ACCT_RE = { shadow:/non-?followers|recommendations|distribution/i, lock:/read.?only|security challenge|password/i, withheld:/not shown on X in /i,
  warning:/content warning|interstitial/i, age:/underage|stated age|logged.?out|protected audience/i };
const TRIG_RE = { auto:/automat|systems?\b|classif|model|grok/i, report:/report/i, legal:/legal demand/i, review:/review/i };
const TRIG_ICON = { auto:"robot", report:"flag", legal:"gavel", review:"reviewer", unknown:"question" };

const norm = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g,"")); return isNaN(n) ? null : n; };
const textOf = x => [x.about,x.description,x.effect].filter(Boolean).join(" ");

function readLabel(x, level){
  const code = String(x.label||x.name||x.type||"");
  const k = norm(code);
  const base = { code, level, posts: level==="post" ? (num(x.posts)||0) : 0, pct: x.percentageOfPosts ? String(x.percentageOfPosts) : "",
    days: num(x.days), daysInPeriod: num(x.daysInPeriod) };
  /* 法的な差し止め */
  const tm = /^\s*(LegalRequest|BystanderReport|UnspecifiedReason)\s*(?:\(([^)]*)\))?\s*$/i.exec(code);
  if (tm){
    const kind = Object.keys(TAKEDOWN).find(n=>n.toLowerCase()===tm[1].toLowerCase());
    const codes = (tm[2]||"").split(/[,\s]+/).map(c=>c.trim().toUpperCase()).filter(Boolean);
    const world = codes.includes("XX"), copy = codes.includes("XY");
    let eff;
    if (level==="acct") eff = new Set([copy?"copyright":"withheld"].concat(world||copy?["shadow"]:[]));
    else eff = new Set(copy ? ["hidden","followersTL","nonFollower","copyright"] : world ? ["hidden","followersTL","nonFollower","withheld"] : ["withheld"]);
    return {...base, takedown:kind, countries: codes.filter(c=>c!=="XX"&&c!=="XY"), world, copy,
      eff, trig:new Set(copy?["report"]:TAKEDOWN[kind].trig), cat: copy?"copyright":"legal", sev:"bad"};
  }
  const d = (level==="acct" ? ACCT_DICT : POST_DICT)[k];
  const eff = new Set(d ? d.eff : []);
  if (!d){
    const re = level==="acct" ? ACCT_RE : POST_RE;
    for (const key in re) if (re[key].test(x.effect||"")) eff.add(key);
    if (level==="post" && /not shown on X in /i.test(x.effect||"")) { eff.delete("hidden"); eff.add("withheld"); }
    if (level==="post" && (eff.has("hidden")||eff.has("profileOnly"))) eff.add("followersTL");
  }
  const trig = new Set(d ? d.trig : []);
  if (!d) for (const key in TRIG_RE) if (TRIG_RE[key].test(x.about||x.description||"")) trig.add(key);
  if (!trig.size) trig.add("unknown");
  let cat = d ? d.cat : "other", gen = null;
  if (!d){
    if (/NSFW|ADULT|SEXUAL/.test(k)) {gen="nsfw";cat="nsfw";}
    else if (/GORE|VIOLEN/.test(k)) {gen="gore";cat="gore";}
    else if (/SPAM/.test(k)) {gen="spam";cat="spam";}
    else if (/ABUS|HATE|INSULT|HARASS/.test(k)) {gen="abuse";cat="abuse";}
    else if (/DMCA|COPYRIGHT/.test(k)) {gen="copyright";cat="copyright";}
    else if (/LEGAL|LAW|WITHHELD/.test(k)) {gen="legal";cat="legal";}
    else gen="unknown";
  }
  return {...base, d, gen, cat, eff, trig, sev: d && d.sev ? d.sev : (level==="acct"?"bad":"warn")};
}
function labelName(l){
  if (l.agg) return t("aggAcct", l.agg);
  if (l.takedown){
    const nm = TAKEDOWN[l.takedown][lang];
    const where = l.copy ? t("copyrightTag") : l.world ? t("worldTag") : l.countries.join(", ");
    return where ? (lang==="en" ? `${nm} – ${where}` : `${nm}（${where}）`) : nm;
  }
  if (l.d) return l.d[lang] || l.d.ja;
  const g = L[lang].gen[l.gen];
  return typeof g==="function" ? g(l.code) : g;
}
function toModel(d){
  const posts = (Array.isArray(d.postLabels)?d.postLabels:[]).map(x=>readLabel(x,"post"));
  const accts = (Array.isArray(d.accountLabels)?d.accountLabels:[]).map(x=>readLabel(typeof x==="string"?{label:x}:x,"acct"));
  const sum = posts.reduce((s,l)=>s+l.posts,0);
  const total = num(d.postCount) ?? sum;
  const p = d.period||{};
  return {posts, accts, sum, total, normal:Math.max(total-sum,0),
    acctCount: Math.max(num(d.totalAccountLabels) ?? 0, accts.length), start:p.startDate, end:p.endDate, tz:p.timezone||"UTC"};
}
function periodText(m){
  const m1=/^(\d{4})-(\d{2})-(\d{2})/.exec(m.start||""), m2=/^(\d{4})-(\d{2})-(\d{2})/.exec(m.end||"");
  if(!m1||!m2) return t("periodUnknown");
  const last = new Date(Date.UTC(+m2[1], +m2[2], 0)).getUTCDate();
  if (m1[1]===m2[1] && m1[2]===m2[2] && m1[3]==="01" && +m2[3]===last) return t("period", +m1[1], +m1[2]);
  return t("periodRange", +m1[2], +m1[3], +m2[2], +m2[3]);
}

const rangeText = m => `${fmtD(m.start)}${t("rangeSep")}${fmtD(m.end)} ${m.tz}`;

let FONTREQ = {};
function setF(ctx,o){ const fs=ST.font[o.r||"body"]; const w=fs[o.w||"b"]; ctx.font=`${w} ${o.s}px ${fs.fam}, ${FB}`; return {w,fam:fs.fam}; }
function meas(ctx,s,o){ setF(ctx,o); return ctx.measureText(String(s)).width; }
function fit(ctx,s,max){ if(ctx.measureText(s).width<=max) return s; while(s.length>1 && ctx.measureText(s+"…").width>max) s=s.slice(0,-1); return s+"…"; }
function T(ctx,str,x,y,o){
  let s=String(str); const f=setF(ctx,o);
  ctx.fillStyle=o.c||TH.fg; ctx.textAlign=o.a||"left"; ctx.textBaseline="alphabetic";
  if(o.max) s=fit(ctx,s,o.max);
  ctx.fillText(s,x,y);
  const k=f.w+"|"+f.fam; FONTREQ[k]=(FONTREQ[k]||"")+s;
  return ctx.measureText(s).width;
}
function runs(ctx,parts,x,y,align){
  let total=0;
  parts.forEach(p=>{ p._w=meas(ctx,p.t,p); total+=p._w+(p.gap||0); });
  let cx = align==="center" ? x-total/2 : align==="right" ? x-total : x;
  parts.forEach(p=>{ T(ctx,p.t,cx,y,{...p,a:"left"}); cx+=p._w+(p.gap||0); });
  return total;
}
function rr(ctx,x,y,w,h,r){ r=Math.min(r,h/2,w/2); ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); } }
function alpha(ctx,a,fn){ ctx.save(); ctx.globalAlpha=a; fn(); ctx.restore(); }
function hline(ctx,y){ ctx.fillStyle = ST.tile==="line" ? TH.fg : TH.line; ctx.fillRect(M,y,W-2*M,ST.tile==="line"?1.5:2); }

function box(ctx,x,y,w,h,opt={}){
  const R = opt.r ?? ST.R, tint = opt.tint;
  if (ST.tile==="pop"){
    ctx.fillStyle=TH.fg; rr(ctx,x+7,y+7,w,h,R); ctx.fill();
    ctx.fillStyle=TH.bg; rr(ctx,x,y,w,h,R); ctx.fill();
    if (tint) alpha(ctx,.28,()=>{ ctx.fillStyle=tint; rr(ctx,x,y,w,h,R); ctx.fill(); });
    else { ctx.fillStyle=TH.card; rr(ctx,x,y,w,h,R); ctx.fill(); }
    ctx.strokeStyle=TH.fg; ctx.lineWidth=4; rr(ctx,x,y,w,h,R); ctx.stroke();
  } else if (ST.tile==="line"){
    ctx.strokeStyle = tint || TH.line; ctx.lineWidth = tint ? 3 : 2; ctx.strokeRect(x+1,y+1,w-2,h-2);
  } else {
    if (tint) alpha(ctx, ST.tile==="natural"?.16:.12, ()=>{ ctx.fillStyle=tint; rr(ctx,x,y,w,h,R); ctx.fill(); });
    else { ctx.fillStyle=TH.card; rr(ctx,x,y,w,h,R); ctx.fill(); }
  }
}

function drawIcon(ctx,name,cx,cy,size,col,lw=3.4){

    T(ctx,text,x+d+10,y+h/2+8.5,{...o,c: kind==="na"?TH.muted:TH.fg});
    return d+10+tw;
  }
  const w = 7+d+9+tw+18;
  if (ST.tile==="pop"){
    ctx.fillStyle=TH.fg; rr(ctx,x+4,y+4,w,h,h/2); ctx.fill();

  } else {
    if (kind==="na"){ ctx.setLineDash([6,5]); ctx.strokeStyle=c; ctx.lineWidth=2; rr(ctx,x+1,y+1,w-2,h-2,h/2); ctx.stroke(); ctx.setLineDash([]); }

    mark(x+7+d/2,y+h/2,c,TH.bg);

/* ================= 1枚目：ひと目でわかる状況 ================= */
function shadowDays(m){
  const ls = m.accts.filter(l=>l.eff.has("shadow") && l.days);
  if (!ls.length) return null;

function statusTiles(m){
  const cnt = k => Math.min(m.total, m.posts.filter(l=>l.eff.has(k)).reduce((s,l)=>s+l.posts,0));
  const acct = k => m.accts.some(l=>l.eff.has(k));

  const tile = (icon,key,st,cap) => ({icon,name:TL[key][0],cap:cap||TL[key][1],st});
  return [
    tile("followers","followers", cnt("followersTL") ? ["warn",t("pHidden",cnt("followersTL"))] : ["ok",t("pVisible")]),
    tile("globe","nonfollow", acct("shadow") ? ["bad", part ? t("pAllExcludedDays",sd.days) : t("pAllExcluded")] : cnt("nonFollower") ? ["warn",t("pExcluded",cnt("nonFollower"))] : ["ok",t("pVisible")]),
    cnt("search") ? tile("search","search",["warn",t("pCount",cnt("search"))],TL.searchHit) : tile("search","search",["na",t("pNa")]),
    tile("reply","reply",["na",t("pNa")]),
    tile("ghost","shadow", acct("shadow") ? ["bad", part ? t("pYesDays",sd.days) : t("pYes")] : ["ok",t("pNo")]),

    tile("lock","lock", acct("lock") ? ["bad",t("pYes")] : ["ok",t("pNo")]),
    (()=>{ const cs=[...new Set([...m.posts,...m.accts].filter(l=>l.eff.has("withheld")).flatMap(l=>l.countries||[]))];
      return tile("gavel","legal", lvl("withheld"), cs.length ? TL.legalWhere(cs.join(", ")) : null); })(),
    tile("copyright","copyright", lvl("copyright"))
  ];
}

function drawPage2(ctx,m){

  const segs=labs.map(l=>({a:Math.max(l.posts/tot*Math.PI*2,MIN),c:l._c}));
  const used=segs.reduce((s,x)=>s+x.a,0);

  let a0=-Math.PI/2; ctx.lineWidth=thick; ctx.lineCap = ST.tile==="natural" && segs.length>1 ? "round" : "butt";
  segs.forEach(s=>{ if(s.a<=0) return; ctx.strokeStyle=s.c; ctx.beginPath();
    const g = ctx.lineCap==="round" ? gap+thick/r*0.5 : gap;
    const st=a0+g/2, en=a0+s.a-g/2; if(en>st){ ctx.arc(cx,cy,r,st,en); ctx.stroke(); } else { ctx.lineCap="butt"; ctx.arc(cx,cy,r,a0,a0+s.a); ctx.stroke(); }
    a0+=s.a; });
  ctx.lineCap="butt";
  if (ST.tile==="pop"){ ctx.strokeStyle=TH.fg; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke(); ctx.beginPath(); ctx.arc(cx,cy,R-thick,0,7); ctx.stroke(); }

  T(ctx,t("noLimit"),cx,cy-34,{s:24,r:"body",w:"b",c:TH.ok,a:"center",max:2*(R-thick)-20});

  };
  stat(560,TH.ok,t("noLimit"),m.normal,labs.length?t("unitMore"):t("unit"));
  stat(700,labs.length?TH.warn:TH.line,t("limitedMax"),m.sum,t("unit"));
  if (m.accts.length) T(ctx,t("plusAcct",m.accts.length),lx,838,{s:24,r:"body",w:"b",c:TH.bad,max:W-M-lx});

  // C. 気をつけること（行数を先に決める）
  const TP=L[lang].tips;
  const cats=[...new Set(all.map(l=>l.cat))];
  let tips=[]; cats.forEach(c=>(TP[c]||TP.other).forEach(x=>{ if(!tips.includes(x)) tips.push(x); }));
  if (!tips.length) tips=TP.none.slice();

    const rowsStart=hy+62;

      list = [agg, ...all.filter(l=>l.level!=="acct")];
    }
    const shown = list.length>fitN ? list.slice(0,fitN-1) : list;
    const hiddenCount = list.length>fitN ? all.length-(list!==all ? m.accts.length+shown.length-1 : shown.length) : 0;
    shown.forEach((l,i)=>{
      const y=rowsStart+i*rowH, mid=y+rowH/2;

      ctx.fillStyle=l._c; ctx.beginPath(); ctx.arc(M+10,mid,11,0,7); ctx.fill();

      T(ctx,labelName(l),M+36,mid+10,{s:28,r:"body",w:"b",c:TH.fg,max:countRight-cw-20-(M+36)});
      kinds.forEach((k,j)=>{

        else { ctx.fillStyle=TH.line; rr(ctx,x-12,mid-2,24,4,2); ctx.fill(); }
      });
      rowsEnd=y+rowH;
    });
    if (hiddenCount>0){
      T(ctx,t("omitted",hiddenCount),M+36,rowsEnd+38,{s:22,r:"body",w:"r",c:TH.muted,max:W-2*M-36});
      rowsEnd+=52;

/* ================= 投稿用テキスト ================= */
/* 公開後にサイトのURLが決まったら、ここに入れる（空なら本文にURL行を付けない） */
const SITE_URL = "https://formulatext.github.io/uth2i/";
function verdictOf(m){
  const shadow = m.accts.some(l=>l.eff.has("shadow")), sd = shadowDays(m);
  if (shadow) return [t("vShadow"), sd && sd.days < sd.of ? t("vShadowSubDays",sd.days,sd.of) : t("vShadowSub")];
  if (m.acctCount>0) return [t("vAcct"), t("vAcctSub",m.acctCount)];
  if (m.posts.length) return [t("vPosts"), t("vPostsSub",m.sum)];
  return [t("vNone"), t("vNoneSub")];
}
function orderedTiles(m){
  let tiles = statusTiles(m);
  if (sortKey==="level"){ const rank={bad:0,warn:0,ok:1,na:2}; tiles = tiles.map((x,i)=>({x,i})).sort((a,b)=>rank[a.x.st[0]]-rank[b.x.st[0]]||a.i-b.i).map(o=>o.x); }
  return tiles;
}
const xCount = s => [...s.replace(/https?:\/\/\S+/g, "x".repeat(23))].reduce((n,ch)=>n + (/[ᄀ-ᅟ⺀-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦]|[\u{20000}-\u{3FFFD}]/u.test(ch) ? 2 : 1), 0);
function clip(s, max){ return [...s].length<=max ? s : [...s].slice(0,max-1).join("")+"…"; }
function buildTexts(m){
  const ja = lang==="ja", [v, vs] = verdictOf(m), per = periodText(m);
  const sep = ja ? "、" : "; ", end = ja ? "。" : ".";
  const trigs = l => [...l.trig].map(k=>L[lang].trig[k]).join(ja?"・":"/");
  /* 本文 */
  const post = ja
    ? `#UtH2i\nXの表示制限レポート（${per}）\n「${v}」でした！` + (SITE_URL ? `\n${SITE_URL}` : "")
    : `#UtH2i\nMy X visibility report (${per})\nResult: "${v}"` + (SITE_URL ? `\n${SITE_URL}` : "");
  /* 1枚目 */
  const tl = orderedTiles(m).map(x=>`${x.name}${ja?"：":": "}${x.st[1]}`).join(ja?"／":"; ");
  const alt1 = ja
    ? `Xの表示制限レポート（${per}・投稿${m.total}件）の1枚目。判定は「${v}」。${vs}。ひと目でわかる状況：${tl}。「判定不可」はこのレポートに記録されない項目。過去1か月分の記録で、いまの状態とは限らない。`
    : `Image 1 of my X visibility report (${per}, ${m.total} posts). Result: ${v}. ${vs}. At a glance: ${tl}. "Not covered" items are not recorded in this report. Covers the past month only.`;
  /* 2枚目 */
  const all=[...m.accts, ...[...m.posts].sort((a,b)=>b.posts-a.posts)];
  const pct = m.total ? Math.round(m.normal/m.total*1000)/10 : 100;
  const labs = all.map(l=>{
    const c = l.level==="acct" ? (l.days ? t("days",l.days,l.daysInPeriod) : t("all")) : (ja?`${l.posts}件`:`${l.posts} posts`);
    return ja ? `${labelName(l)}：${c}（きっかけ：${trigs(l)}）` : `${labelName(l)}, ${c} (trigger: ${trigs(l)})`;
  });
  const TP=L[lang].tips, cats=[...new Set(all.map(l=>l.cat))];
  let tips=[]; cats.forEach(c=>(TP[c]||TP.other).forEach(x=>{ if(!tips.includes(x)) tips.push(x); }));
  if (!tips.length) tips=TP.none.slice();
  const head = ja
    ? `Xの表示制限レポートの2枚目「内訳ときっかけ」。制限なし${m.normal}件以上（${pct}%以上）、制限あり最大${m.sum}件。`
    : `Image 2 of my X visibility report: breakdown and triggers. No limits: ${m.normal} posts or more (${pct}% or more). Limited: at most ${m.sum} posts.`;
  const tail = (ja?"気をつけること：":" What to watch: ") + tips.join(ja?"／":"; ") + end;
  let body = all.length ? (ja?"ラベル：":" Labels: ") : (ja?"記録されたラベルはなし。":" No labels recorded.");
  let used = [...head].length + [...tail].length + [...body].length + 2, shown = 0;
  for (const x of labs){ const add = (shown?(ja?"／":"; "):"") + x; if (used + [...add].length > 960) break; body += add; used += [...add].length; shown++; }
  if (shown < labs.length) body += ja ? `／ほか${labs.length-shown}種` : `; ${labs.length-shown} more`;
  if (all.length) body += end;
  const alt2 = `${head}${body}${tail}`;
  return {post, alt1: clip(alt1,1000), alt2: clip(alt2,1000)};
}
function renderTexts(){
  if (!model) return;
  const tx = buildTexts(model);
  $("postX").href = "https://x.com/intent/post?text=" + encodeURIComponent(tx.post);
  [["post",tx.post,xCount(tx.post),280,"cntPost"],["alt1",tx.alt1,[...tx.alt1].length,1000,"cntAlt"],["alt2",tx.alt2,[...tx.alt2].length,1000,"cntAlt"]].forEach(([k,v,n,max,ck])=>{
    $("tx-"+k).value = v;
    $("cnt-"+k).textContent = t(ck,n);
    $("cnt-"+k).classList.toggle("over", n>max);
  });
}
document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click", async ()=>{

const HKEY="uth-history", CKEY="uth-current";
let currentId=null;
const hashId = str => { let h=5381; for (let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return "r"+(h>>>0).toString(36)+str.length.toString(36); };

function fileBase(){

  return `uth2i-${p ? p[1]+"-"+p[2] : "report"}-${styleKey}-${modeKey}-${lang}`;

function say(key,arg){ lastStatus=key?[key,arg]:null; $("status").textContent = key ? t(key,arg) : ""; layoutDrawer(); }
/* Claudeの表示環境の外（自分のサイトなど）では、通常のダウンロードで保存する */
const STANDALONE = typeof window.claude === "undefined";
function plainDownload(filename, data){
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
  const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function trySave(filename, data){
  if (!downloads && STANDALONE){ plainDownload(filename, data); return "ok"; }
  for (let i=0;i<3;i++){
    try { await downloads.save({filename, data}); return "ok"; }
    catch(e){
      const c = e && e.code;
      if (c==="declined") return "declined";
      if (c==="rate_limited"){ await sleep(1200); continue; }
      return "fail";
    }
  }
  return "busy";
}
async function saveOne(i){ if((!downloads && !STANDALONE) || !blobs[i]) return "fail"; return trySave(`${fileBase()}_${i+1}.png`, blobs[i]); }

    return;
  }
  if (pendingSecond){
    const r=await saveOne(1);
    if (r==="ok"){ pendingSecond=false; say("svBoth"); } else say(failKey(r));
    return;
  }
  say("sv1");
  const r1=await saveOne(0);
  if (r1!=="ok"){ say(failKey(r1)); return; }
  await sleep(900);
  say("sv2");
  const r2=await saveOne(1);

  pendingSecond=true; say("svNext");

try { const old=localStorage.getItem("uth-last"); if(old){ const d=JSON.parse(old); if(isReport(d)){ const h=loadHistory(); const [id]=addReport(h,d); saveHistory(sortHistory(h)); localStorage.setItem(CKEY,id); } localStorage.removeItem("uth-last"); } } catch(_){}
(()=>{
  const h=loadHistory(); let cid=null; try{ cid=localStorage.getItem(CKEY); }catch(_){}
  const e = h.find(x=>x.id===cid) || null;
  if (e) loadText(JSON.stringify(e.report), false); else { showBlank(); setState("stIdle"); }
  renderHistory();
})();
(async()=>{
  try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(_){ downloads=null; }
  updateShareFiles();
  if(!downloads && !shareFiles && !STANDALONE) say("svUnavailable");
  syncButtons();
})();
</script>
